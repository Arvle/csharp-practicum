name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'
  POSTGRES_PASSWORD: test_password_123
  JWT_SECRET: test-secret-for-ci-only-test-secret-for-ci-only

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: csharppracticum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.mod
      - name: Download dependencies
        working-directory: ./backend
        run: go mod download
      - name: Test backend
        working-directory: ./backend
        run: go test ./...
        env:
          APP_ENV: test
          DATABASE_URL: postgres://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/csharppracticum_test?sslmode=disable
          JWT_SECRET: ${{ env.JWT_SECRET }}
      - name: Build backend
        working-directory: ./backend
        run: go build -v ./cmd/api

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: ./frontend
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck frontend
        working-directory: ./frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: csharppracticum-backend:test
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: csharppracticum-frontend:test
