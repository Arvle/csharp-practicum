services:
  postgres:
    image: postgres:16-alpine
    container_name: csharp-postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csharppracticum}
      POSTGRES_USER: ${POSTGRES_USER:-csharp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csharp_admin} -d ${POSTGRES_DB:-csharppracticum}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csharp-backend
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-csharp_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-csharppracticum}?sslmode=disable
      PORT: "8080"
      UPLOAD_DIR: /home/appuser/uploads
    networks:
      - internal
      - web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ./uploads:/home/appuser/uploads:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-}
    container_name: csharp-frontend
    networks:
      - web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: csharp-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./uploads:/app/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    networks:
      - web
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  internal:
    driver: bridge
    internal: true
  web:
    driver: bridge

volumes:
  pg_data:
  caddy_data:
  caddy_config: